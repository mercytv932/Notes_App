<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
  <style>

  </style>
</head>
<body>
  
<input type="text" placeholder="title" class="noteInput">
<textarea id="noteContent"></textarea>
<button class="addBtn">Add Note</button>

<div id="notesList"></div>


  <script>
const noteInput = document.querySelector(".noteInput");
const noteContent = document.querySelector("#noteContent");
const addBtn = document.querySelector(".addBtn");
const notesList = document.querySelector("#notesList");

  let notes = [];

addBtn.addEventListener("click", function(){
  const title = noteInput.value;
  const content = noteContent.value;

  //Note Object
  const note = {
    date: Date.now(),
    title: title,
    content: content
  }
  console.log(note);

  const newDiv = document.createElement("div");
  const newHeadingTag = document.createElement("h3")
  newHeadingTag.textContent = note.title;
  const newParagraph = document.createElement("P")
  newParagraph.textContent = note.content;

  //place h3 and p inside the div
  newDiv.appendChild(newHeadingTag);
  newDiv.appendChild(newParagraph);

  //add the whole div to notesList
  notesList.appendChild(newDiv);

  notes.push(note);
  console.log(notes);

});

  </script>
</body>
</html>
